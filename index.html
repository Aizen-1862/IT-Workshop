<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do & Calculator App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-wrapper">
    <!-- To-Do Section -->
    <section class="card todo-section">
      <h2>To-Do List</h2>
      <form id="todo-form" class="todo-input-group">
        <input type="text" id="todo-input" placeholder="Add a new task..." required>
        <button type="submit">Add</button>
      </form>
      <ul id="todo-list"></ul>
    </section>

    <!-- Calculator Section -->
    <section class="card calc-section">
      <h2>Calculator</h2>
      <input type="text" id="calc-display" readonly placeholder="0">
      <div class="calc-grid">
        <button class="btn-clear" data-action="clear">C</button>
        <button class="btn-op" data-action="delete">⌫</button>
        <button class="btn-op" data-value="/">÷</button>
        <button class="btn-op" data-value="*">×</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="btn-op" data-value="-">−</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="btn-op" data-value="+">+</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="btn-equal" data-action="calculate" rowspan="2">=</button>

        <button class="btn-zero" data-value="0">0</button>
        <button data-value=".">.</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
